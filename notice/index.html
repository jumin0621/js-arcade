<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="JS-Arcade의 최신 업데이트, 시스템 공지 및 새로운 게임 출시 소식을 확인하세요."
		/>
		<meta property="og:title" content="JS-Arcade 공식 공지사항" />

		<title>공지사항 | JS-Arcade</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<a href="../" class="logo-group" aria-label="JS-Arcade 홈으로 이동">
				<img
					src="https://i.ibb.co/21Jb6jD1/image.png"
					alt="JS-Arcade 로고 심볼"
					class="logo-symbol"
				/>
				<span class="logo-text">JS-Arcade</span>
			</a>
			<nav>
				<ul>
					<li><a href="../">홈</a></li>
					<li><a href="./">공지사항</a></li>
					<li>
						<a href="../devlog">개발일지</a>
					</li>
				</ul>
			</nav>
		</header>
		<section class="notice-container">
			<div class="notice-header">
				<h2>📢 Notice</h2>
				<p>JS-Arcade의 새로운 소식을 전해드립니다.</p>
			</div>

			<ul class="notice-list">
				<li class="notice-item" onclick="openNotice('domain')">
					<span class="notice-tag notice">NOTICE</span>
					<div class="notice-info">
						<span class="notice-title">도메인 신청 완료</span>
						<span class="notice-date">2026.04.17</span>
					</div>
				</li>

				<li class="notice-item" onclick="openNotice('launch-announcement')">
					<span class="notice-tag notice">NOTICE</span>
					<div class="notice-info">
						<span class="notice-title"
							>JS-Arcade 플랫폼 정식 런칭 및 개발일지 오픈 안내</span
						>
						<span class="notice-date">2026.04.20</span>
					</div>
				</li>

				<li class="notice-item" onclick="openNotice('mobile-optimization')">
					<span class="notice-tag update">UPDATE</span>
					<div class="notice-info">
						<span class="notice-title"
							>모바일 환경 최적화(코드 블록 가로 스크롤) 업데이트 완료</span
						>
						<span class="notice-date">2026.04.21</span>
					</div>
				</li>
			</ul>
		</section>
		<div id="devlogModal" class="modal-overlay">
			<div class="modal-window">
				<div class="modal-header">
					<h2 id="modalTitle">Notice</h2>
					<button class="close-btn" onclick="closeModal()">✕</button>
				</div>
				<div id="modalContent" class="modal-body"></div>
			</div>
		</div>
		<script>
			function openNotice(slug) {
				// 1. 공지사항 상세 파일 경로 (notice/ 폴더 안에 있다고 가정)
				const newUrl = `./${slug}.html`;
				history.pushState(null, "", newUrl);

				const modal = document.getElementById("devlogModal");
				const contentArea = document.getElementById("modalContent");
				const modalTitle = document.getElementById("modalTitle");

				modal.style.display = "flex";
				contentArea.innerHTML =
					'<p style="text-align:center;">불러오는 중...</p>';

				// 2. fetch로 공지사항 내용 가져오기
				fetch(newUrl)
					.then((response) => {
						if (!response.ok) throw new Error("공지사항을 찾을 수 없습니다.");
						return response.text();
					})
					.then((html) => {
						const parser = new DOMParser();
						const doc = parser.parseFromString(html, "text/html");

						// 제목 업데이트
						const titleText = doc.querySelector("h1")
							? doc.querySelector("h1").innerText
							: "Notice";
						modalTitle.innerText = titleText;

						// 본문 주입
						const content = doc.querySelector("main")
							? doc.querySelector("main").innerHTML
							: html;
						contentArea.innerHTML = content;

						document.body.style.overflow = "hidden";
					})
					.catch((err) => {
						contentArea.innerHTML = `<p style="color:red; text-align:center;">${err.message}</p>`;
					});
			}

			// 모달 닫기 (개발일지와 동일)
			function closeModal() {
				history.pushState(null, "", "./index.html");
				document.getElementById("devlogModal").style.display = "none";
				document.body.style.overflow = "auto";
			}
		</script>
	</body>
</html>
