<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JS-Arcade | 바닐라JS 웹게임 아카이브</title>
		<link rel="icon" type="image/png" href="./assets/logo.png" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div id="emoji-hidden">
			👬🧌🧟‍♀️🧟‍♂️🧟🧞‍♀️🧞‍♂️🧝‍♀️🧝🧜‍♀️🧜‍♂️🧛‍♀️🧚‍♂️🧙‍♀️🧙‍♂️🦹‍♀️💂‍♀️👹🕵️‍♀️👮‍♀️👩‍🚒👩‍🚀🧑‍🌾🧘🤹‍♂️🚵‍♀️🤸‍♀️🚴‍♂️⛹️‍♂️😱🤖🏄‍♂️🏇☠️💀🧗‍♀️💃🤺👤🧠🫆🫀🗣️🫂👄
		</div>
		<main>
			<section id="selection-room">
				<div class="search-area">
					<h1>어떤 게임을 즐기고 싶으신가요?</h1>
					<p class="sub-text">
						바닐라 JS로 제작된 다양한 미니게임을 만나보세요.
					</p>
					<label for="game-search" class="visually-hidden">게임 검색</label>
					<input
						type="text"
						id="game-search"
						placeholder="게임 제목을 입력하세요..."
					/>
				</div>

				<aside class="ad-container">
					<a
						href="https://open.kakao.com/o/sSTaIFpi"
						target="_blank"
						rel="noopener noreferrer"
						class="ad-banner"
					>
						<div class="ad-content">
							<p>📢 제휴문의</p>
						</div>
					</a>
				</aside>

				<h2 class="visually-hidden">최신 게임 리스트</h2>
				<div class="game-grid" id="game-list"></div>
			</section>

			<section id="play-room" style="display: none">
				<h2 class="visually-hidden">게임 플레이</h2>
				<div style="text-align: left; margin-bottom: 15px">
					<button
						type="button"
						onclick="exitGame()"
						style="
							background: none;
							border: none;
							color: #00e5ff;
							cursor: pointer;
							font-weight: bold;
							font-size: 1rem;
						"
					>
						← 다른 게임 선택하기
					</button>
				</div>
				<iframe
					id="game-container"
					src=""
					title="웹게임 실행 창"
					style="
						width: 100%;
						height: 550px;
						border: none;
						border-radius: 12px;
						background: #1e1e1e;
						box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
					"
				></iframe>
			</section>
		</main>

		<script type="module" src="main.js"></script>
		<script type="module">
			import { initHeader, initFooter } from "./common/layout.js";
			initHeader();
			initFooter();
		</script>
	</body>
</html>
