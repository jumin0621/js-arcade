<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>JS-Arcade | 슬라이드 퍼즐</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="game-wrapper">
			<div class="game-header">
				<div class="info-item">
					<span class="info-label">MOVES</span>
					<span id="moveDisplay" class="info-value">0</span>
				</div>

				<div class="hint-container" id="hintContainer">
					<div class="hint-thumb" id="hintThumb"></div>
					<span class="hint-label">HINT</span>
					<div class="hint-preview" id="hintPreview"></div>
				</div>

				<div class="info-item right">
					<span class="info-label">DIFFICULTY</span>
					<span id="diffDisplay" class="info-value">READY</span>
				</div>
			</div>

			<div class="canvas-container">
				<div id="loadingSpinner" class="spinner" style="display: none"></div>
				<div id="puzzleBoard" class="puzzle-board" style="display: none"></div>
			</div>

			<div class="controls-guide">
				<p>🧩 조각을 클릭하여 빈칸으로 이동시키세요.</p>
				<p>이미지를 완벽하게 복구하면 완료!</p>
			</div>
		</div>

		<div id="gameModal" class="modal-overlay">
			<div class="modal-content">
				<h2 id="modalTitle">SLIDE PUZZLE</h2>
				<p id="modalDesc">난이도를 선택해 이미지를 복구하세요!</p>

				<div id="difficultyOptions" class="difficulty-options">
					<button class="diff-btn" data-grid="3">초급 (3x3)</button>
					<button class="diff-btn" data-grid="5">중급 (5x5)</button>
					<button class="diff-btn" data-grid="7">고급 (7x7)</button>
				</div>

				<div id="rankInputArea" class="rank-input-area">
					<input
						type="text"
						id="nicknameInput"
						class="nickname-input"
						placeholder="닉네임 (3~8자)"
						maxlength="8"
					/>
				</div>
				<div id="resultOptions" class="modal-buttons" style="display: none">
					<button id="startBtn" class="primary-btn">랭킹 등록</button>
					<button id="restartBtn" class="secondary-btn">처음으로</button>
				</div>
			</div>
		</div>

		<script type="module" src="js-puzzle.js"></script>
	</body>
</html>
