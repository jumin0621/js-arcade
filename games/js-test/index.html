<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JS-Arcade | 바닐라 스네이크 (디렉터 모드)</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="game-wrapper">
			<div class="game-header">
				<div class="score-container">SCORE: <span id="score">0</span></div>
			</div>

			<canvas id="snakeGame" width="400" height="400"></canvas>

			<!-- [디렉터 모드] 코드 오버레이 -->
			<div id="codeOverlay" class="code-overlay"></div>

			<div class="mobile-controls" id="joystick">
				<div class="control-row">
					<button class="btn-up" onclick="setDir('UP')">▲</button>
				</div>
				<div class="control-row">
					<button class="btn-left" onclick="setDir('LEFT')">◀</button>
					<button class="btn-down" onclick="setDir('DOWN')">▼</button>
					<button class="btn-right" onclick="setDir('RIGHT')">▶</button>
				</div>
			</div>

			<div class="controls-guide">
				<p>방향키(↑ ↓ ← →)로 조작 · 숫자 1~9 디렉터 모드 · 0 정상 속도</p>
			</div>

			<div id="gameModal" class="modal-overlay">
				<div class="modal-content">
					<h2 id="modalTitle">VANILLA SNAKE</h2>
					<p id="modalDesc">방향키를 이용해 길게 살아남으세요!</p>

					<div id="rankInputArea" class="rank-input-area">
						<input
							type="text"
							id="nicknameInput"
							class="nickname-input"
							placeholder="닉네임 (3~8자)"
							maxlength="8"
						/>
					</div>

					<div class="modal-buttons">
						<button id="startBtn" class="primary-btn">게임 시작</button>
						<button id="restartBtn" class="secondary-btn" style="display: none">
							다시 시작
						</button>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="js-snake.js"></script>
	</body>
</html>
