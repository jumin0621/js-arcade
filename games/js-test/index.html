<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>JS-Arcade | 픽셀 이터 디렉터 연출 모드</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="game-wrapper">
			<div class="hud">
				<div class="hud-box score-box">
					<div class="hud-label">SCORE</div>
					<div id="scoreDisplay" class="hud-value">0</div>
				</div>
				<div class="hud-box stage-box">
					<div class="hud-label">STAGE</div>
					<div id="stageDisplay" class="hud-value">1</div>
				</div>
			</div>

			<canvas id="gameCanvas"></canvas>
		</div>

		<div id="gameModal" class="modal-overlay">
			<div class="modal-content">
				<h2 id="modalTitle">PIXEL EATER</h2>
				<p id="modalDesc"></p>

				<div id="rankInputArea" class="rank-input-area" style="display: none">
					<input
						type="text"
						id="nicknameInput"
						class="nickname-input"
						placeholder="닉네임 입력 (2자 이상)"
						maxlength="10"
					/>
				</div>

				<div class="modal-buttons">
					<button id="startBtn" class="primary-btn">GAME START</button>
					<button id="restartBtn" class="secondary-btn" style="display: none">
						처음으로
					</button>
				</div>
			</div>
		</div>

		<script type="module" src="js-pixeleater.js"></script>
	</body>
</html>
